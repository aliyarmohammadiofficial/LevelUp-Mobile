name: levelup

description: "LevelUp — Level up your health, one day at a time."

publish_to: "none"

version: 0.1.0+1


environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"


dependencies:

  flutter:
    sdk: flutter


  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1


  # Routing
  go_router: ^15.1.2


  # Backend
  supabase_flutter: ^2.9.0

  firebase_core: ^3.13.1
  firebase_auth: ^5.5.1
  firebase_messaging: ^15.2.5


  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.3


  # Notifications
  flutter_local_notifications: ^19.1.0
  timezone: ^0.10.0
  permission_handler: ^12.0.0


  # Deep Links
  app_links: ^6.4.1


  # Networking
  dio: ^5.8.0+1


  # Models
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0


  # UI
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8


  # Animation
  lottie: ^3.3.1
  flutter_animate: ^4.5.2
  rive: ^0.13.20


  # Utilities
  intl: ^0.20.2
  equatable: ^2.0.7
  flutter_svg: ^2.1.0
  fl_chart: ^0.71.0



dev_dependencies:


  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0


  # Code Generation

  build_runner: ^2.4.15

  freezed: ^3.0.6

  json_serializable: ^6.9.5

  riverpod_generator: ^2.6.5



dependency_overrides:

  # Android / Flutter 3.35 compatibility fix

  app_links: ^6.4.1



flutter:

  uses-material-design: true


  assets:

    - assets/images/
    - assets/icons/
    - assets/illustrations/
    - assets/animations/
